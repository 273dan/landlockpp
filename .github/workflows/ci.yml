name: CI

on:
  push:
    branches: [ main ]
jobs:
  test:
    name: Test ${{ matrix.env.os }}
    runs-on: ${{ matrix.env.os }}
    strategy:
      fail-fast: false
      matrix:
        env:
        - os: ubuntu-26.04
          cc: gcc
          cxx: g++
        - os: ubuntu-24.04
          cc: gcc-14
          cxx: g++-14
        - os: ubuntu-22.04
          cc: gcc-14
          cxx: g++-14
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install gcc-14 on ubuntu-22.04
        if: matrix.env.os == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: build
        env:
          CC: ${{ matrix.env.cc }}
          CXX: ${{ matrix.env.cxx }}
        run: |
          make build

      - name: check landlock version
        run: |
          make which-ver
          
      - name: run tests
        run: |
          make test

