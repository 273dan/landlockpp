name: CI

on:
  push:
    branches: [ main ]
jobs:
  test:
    name: Test ${{ matrix.env.os }}
    runs-on: ${{ matrix.env.os }}
    strategy:
      fail-fast: false
      matrix:
        env:
        - os: ubuntu-26.04
          cc: gcc
          cxx: g++
        - os: ubuntu-24.04
          cc: gcc-14
          cxx: g++-14
        - os: ubuntu-22.02
          cc: gcc-13
          cxx: g++-13
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and run tests
        env:
          CC: ${{ matrix.env.cc }}
          CXX: ${{ matrix.env.cxx }}
        run: |
          make test

